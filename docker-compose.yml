services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expireguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expireguard}
      POSTGRES_DB: ${POSTGRES_DB:-expireguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expireguard} -d ${POSTGRES_DB:-expireguard}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-expireguard}:${POSTGRES_PASSWORD:-expireguard}@db:5432/${POSTGRES_DB:-expireguard}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-expireguard}:${POSTGRES_PASSWORD:-expireguard}@db:5432/expireguard_test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
